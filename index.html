  h+=`<div class="card"><svg class="ring" viewBox="0 0 120 120" width="150" height="150"><circle cx="60" cy="60" r="52" stroke="var(--bd)"/><circle class="pg" cx="60" cy="60" r="52" stroke="${col}" stroke-dasharray="${(p*3.267).toFixed(1)} 327" transform="rotate(-90 60 60)"/><text x="60" y="58" text-anchor="middle" font-size="26" font-weight="800" fill="currentColor">${p}%</text><text x="60" y="76" text-anchor="middle" font-size="12" fill="currentColor">${c}/${t}</text></svg><p style="text-align:center;font-size:18px"><b>${gr}</b></p><div class="g3"><div><b>${c}</b>✅ Correct</div><div><b>${w}</b>❌ Wrong</div><div><b>${tu}</b>⏰ Time up</div></div><p class="note" style="text-align:center">⏱ ${Math.floor(tm/60)}m ${tm%60}s total · about ${Math.round(tm/t)}s per question${pv?`<br>Previous attempt: ${pv.s}/${pv.t} → ${df>0?"📈 +"+df+"%":df<0?"📉 "+df+"%":"same score"}`:""}</p><p class="note" id="sv" style="text-align:center">${quiz.status||""}</p>${x.b.length?`<div style="text-align:center">${x.b.map(y=>`<span class="badge">${y}</span> `).join("")}</div>`:""}</div><button class="btn" onclick="res('r')">📝 Revise my mistakes</button><br><br><button class="btn" onclick="start('${quiz.s.id}',${quiz.i},${quiz.k},${quiz.ex?1:0})">🔁 Try again (shuffled)</button><br><br><button class="btn" onclick="home()">🏠 Home and My Results</button>`;
  if(p>=80&&!quiz.cf){quiz.cf=1;confetti()}}

function jsonp(u){return new Promise((res,rej)=>{const cb="vp"+Date.now(),sc=document.createElement("script"),t=setTimeout(()=>{rej(new Error(""));sc.remove()},15000);window[cb]=d=>{clearTimeout(t);res(d);sc.remove();delete window[cb]};sc.onerror=()=>{clearTimeout(t);rej(new Error(""));sc.remove()};sc.src=u+"&callback="+cb;document.head.appendChild(sc)})}
async function getRows(){const u=SHEET_URL+"?key="+encodeURIComponent(sessionStorage.getItem("vp_k")||"");let t;try{t=await to(fetch(u).then(x=>x.text()),15000)}catch(e){return await jsonp(u)}try{return JSON.parse(t)}catch(e){throw new Error("The script replied with an error: "+t.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,200))}}
function tlogin(){if(sessionStorage.getItem("vp_k"))return dash();app.innerHTML=`<button class="back" onclick="home()">← Back</button><div class="card"><h2>👩‍🏫 Teacher login</h2><input id="tk" type="password" placeholder="Teacher key"><p class="note">Use the secret word from the first line of Code.gs.</p><button class="btn" onclick="sessionStorage.setItem('vp_k',$('#tk').value);dash()">Open dashboard</button></div>`}
async function dash(f){f=f||"All";
 app.innerHTML=`<div class="hrow"><button class="back" onclick="home()">← Back</button><button class="back" onclick="dash('${f}')">🔄 Refresh</button></div><h2>Teacher Dashboard</h2><div id="t">Loading…</div>`;
 try{const r=await getRows();if(r.error==="key"){sessionStorage.removeItem("vp_k");throw new Error("Wrong teacher key. Use the secret word written in the first line of Code.gs.")}if(!r.rows)throw new Error("The Sheet script sent an unexpected reply.");const mp={};r.rows.forEach(v=>{const x=mp[v[1]]||(mp[v[1]]={name:v[2],cls:String(v[3]),attempts:[]});x.attempts.push({title:v[4],s:+v[5],t:+v[6],tm:+v[8],d:String(v[9]).slice(0,10)})});const st=Object.values(mp).filter(x=>f==="All"||x.cls===f);
 const at=[];st.forEach(x=>(x.attempts||[]).forEach(a=>at.push({n:x.name,...a})));
 const pc=a=>Math.round(a.s*100/a.t),avg=at.length?Math.round(at.reduce((m,a)=>m+pc(a),0)/at.length):0;
 const rows=st.map(x=>{const a=x.attempts||[],av=a.length?Math.round(a.reduce((m,y)=>m+pc(y),0)/a.length):0;return[x.name,x.cls,a.length,av+"%",a.length?Math.max(...a.map(pc))+"%":"-",a.length?a[a.length-1].d:"-",av]}).sort((p,q)=>q[6]-p[6]);
 at.sort((p,q)=>(q.d||"").localeCompare(p.d||""));
 const tb=(h,r)=>`<div class="card wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>"<tr>"+x.map(c=>`<td>${esc(c)}</td>`).join("")+"</tr>").join("")}</table></div>`;
 $("#t").innerHTML=`<div class="tabs">${["All","8th","10th"].map(c=>`<button class="${c===f?"on":""}" onclick="dash('${c}')">${c}</button>`).join("")}</div><div class="g3"><div><b>${st.length}</b>Students</div><div><b>${at.length}</b>Tests taken</div><div><b>${avg}%</b>Class average</div></div>`+(st.length?`<h2>🏅 Students (by average)</h2>`+tb(["Name","Class","Tests","Avg","Best","Last"],rows.map(r=>r.slice(0,6)))+`<h2>🕒 Recent tests</h2>`+tb(["Name","Test","Score","%","Time","Date"],at.slice(0,50).map(a=>[a.n,a.title,a.s+"/"+a.t,pc(a)+"%",a.tm?Math.floor(a.tm/60)+"m "+a.tm%60+"s":"-",a.d])):"No results in the Sheet yet. Finish one test, wait a few seconds, then tap Refresh.")}
 catch(e){$("#t").textContent=(e&&e.message)||"Could not reach the Sheet. In Apps Script set access to Anyone, then Deploy a New version."}}
init();
