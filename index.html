{id:"p10",cls:"10th",sub:"Science · Physics",ico:"💡",ch:[
["Light: Reflection and Refraction",[
["Which mirror is used in vehicle headlights?",["Plane","Concave","Convex","Cylindrical"],1,"A concave mirror gives a parallel beam from the bulb at focus."],
["Which mirror is used as a rear-view mirror?",["Plane","Concave","Convex","Cylindrical"],2,"It gives a wider field of view and an erect image."],
["The focal length of a spherical mirror is:",["R","R/2","2R","R/4"],1,"f = R/2."],
["The mirror formula is:",["1/v + 1/u = 1/f","1/v − 1/u = 1/f","v + u = f","uv = f"],0,"Used with the sign convention."],
["An object at C of a concave mirror gives an image at:",["C, real and same size","F, enlarged","Behind mirror","Infinity"],0,"The image is inverted too."],
["Magnification is negative for a:",["Real image","Virtual image","Plane mirror","Convex mirror"],0,"Real images are inverted."],
["The speed of light in vacuum is:",["3×10⁶ m/s","3×10⁸ m/s","3×10¹⁰ m/s","3×10⁵ m/s"],1,"It is the maximum speed possible."],
["Snell’s law states:",["sin i / sin r = constant","i = r","tan i = tan r","sin i + sin r = constant"],0,"The constant is the refractive index."],
["Absolute refractive index n equals:",["c/v","v/c","c×v","1/c"],0,"c is speed in vacuum, v in the medium."],
["Light bends towards the normal when it goes from:",["Rarer to denser","Denser to rarer","Vacuum to vacuum","Along the normal"],0,"Speed decreases in the denser medium."],
["The SI unit of power of a lens is:",["Dioptre","Metre","Watt","Newton"],0,"P = 1/f with f in metres."],
["Which lens always diverges light?",["Convex","Concave","Biconvex","Plano-convex"],1,"A concave lens is thinner at the centre."],
["The power of a convex lens with f = 50 cm is:",["+0.5 D","+2 D","−2 D","+5 D"],1,"P = 1/0.5 = +2 D."],
["A concave lens always forms an image that is:",["Real and inverted","Virtual, erect, diminished","Virtual and enlarged","Real and magnified"],1,"This holds for any object position."],
["A convex lens gives a real, inverted, same-size image when the object is at:",["F","2F","Between F and O","Infinity"],1,"The image is also at 2F."],
["A magnifying glass is a:",["Convex lens","Concave lens","Concave mirror","Plane mirror"],0,"Object kept between F and optical centre."],
["The refractive index of water is about:",["1.00","1.33","1.50","2.42"],1,"Glass is about 1.5."],
["Which has the highest refractive index?",["Water","Glass","Diamond","Air"],2,"Diamond is 2.42."],
["The focal length of a concave mirror by sign convention is:",["Positive","Negative","Zero","Infinite"],1,"Measured against the direction of incident light."],
["The focal length of a plane mirror is:",["Zero","Infinite","Equal to R","Negative"],1,"Parallel rays never converge."],
["The image formed by a plane mirror is:",["Virtual and erect","Real and inverted","Real and erect","Virtual and inverted"],0,"It is the same size and laterally inverted."],
["With the object between the pole and focus of a concave mirror, the image is:",["Virtual, erect and enlarged","Real and inverted","Real and small","Virtual and small"],0,"This is how a shaving mirror works."],
["A shaving mirror is a:",["Concave mirror","Convex mirror","Plane mirror","Cylindrical mirror"],0,"It gives an enlarged erect image at close range."],
["The image formed by a convex mirror is always:",["Virtual, erect and diminished","Real and inverted","Real and enlarged","Virtual and enlarged"],0,"This gives a wide field of view."],
["A concave mirror has f = 10 cm. Its radius of curvature is:",["20 cm","5 cm","10 cm","40 cm"],0,"R = 2f."],
["An object is 30 cm from a concave mirror of f = 15 cm. The image is:",["30 cm in front of the mirror","15 cm behind the mirror","60 cm in front","At infinity"],0,"The object is at C, so the image forms at C."],
["Light travels at 2×10⁸ m/s in a medium. Its refractive index is:",["1.5","0.67","2","3"],0,"n = 3×10⁸ / 2×10⁸."],
["When light passes from air into glass its speed:",["Decreases","Increases","Stays the same","Becomes zero"],0,"Glass is optically denser."],
["A ray through a rectangular glass slab emerges:",["Parallel to the incident ray but shifted sideways","Along the normal","Bent towards the base","Reflected back"],0,"Lateral displacement occurs."],
["A ray passing through the optical centre of a lens:",["Goes straight without deviation","Bends towards the axis","Bends away from the axis","Is reflected"],0,"The lens is thin at the optical centre."],
["A ray parallel to the principal axis of a convex lens passes through:",["The principal focus","The optical centre","Infinity","The pole"],0,"This is a standard ray-diagram rule."],
["The power of a concave lens is:",["Negative","Positive","Zero","Infinite"],0,"Its focal length is negative."],
["A lens with focal length −25 cm has power:",["−4 D","+4 D","−0.25 D","+0.25 D"],0,"P = 1/(−0.25 m)."],
["Two lenses of +2 D and +3 D in contact have combined power:",["+5 D","+1 D","+6 D","−1 D"],0,"Powers add."],
["Magnification of a lens equals:",["Image height / object height","Object distance / image distance","Focal length / object distance","Power × focal length"],0,"m = h′/h = v/u."],
["An object at infinity in front of a convex lens gives an image that is:",["Real, inverted, highly diminished at F","Virtual at infinity","Real at 2F","Virtual at F"],0,"Parallel rays converge at the focus."],
["Which lens is used in a camera?",["Convex lens","Concave lens","Plane glass","Cylindrical lens"],0,"It forms a real image on the film or sensor."],
["Refraction occurs because light changes its:",["Speed","Colour","Frequency","Energy"],0,"Frequency stays the same."],
["Which has greater optical density, water or kerosene?",["Kerosene","Water","Both equal","Neither"],0,"Kerosene has a higher refractive index (about 1.44), though it is less dense by mass."],
["The focal length of a convex lens is taken as:",["Positive","Negative","Zero","Infinite"],0,"By the new Cartesian sign convention."]]],
["Human Eye and Colourful World",[
["The size of the pupil is controlled by the:",["Retina","Iris","Cornea","Lens"],1,"The iris widens or narrows the pupil."],
["The image in the human eye forms on the:",["Cornea","Iris","Retina","Pupil"],2,"The retina has light-sensitive cells."],
["The near point of a normal eye is:",["10 cm","25 cm","50 cm","Infinity"],1,"The least distance of distinct vision."],
["The far point of a normal eye is:",["25 cm","1 m","100 m","Infinity"],3,"A normal eye can see very distant objects."],
["Myopia is corrected using a:",["Concave lens","Convex lens","Cylindrical lens","Plane mirror"],0,"The image forms in front of the retina."],
["Hypermetropia is corrected using a:",["Concave lens","Convex lens","Bifocal lens only","Plane glass"],1,"The image forms behind the retina."],
["Presbyopia is caused by:",["Weak ciliary muscles with age","Long eyeball","Short eyeball","Damaged cornea"],0,"Bifocal lenses can correct it."],
["The ability of the eye lens to change focal length is:",["Accommodation","Dispersion","Refraction","Reflection"],0,"Done by the ciliary muscles."],
["Most refraction of light in the eye occurs at the:",["Outer surface of the cornea","Retina","Iris","Pupil"],0,"The lens only fine-tunes the focus."],
["A rainbow involves dispersion, refraction and:",["Total internal reflection","Scattering","Diffraction","Polarisation"],0,"Water droplets act like tiny prisms."],
["The sky looks blue because of:",["Scattering of blue light","Absorption of red","Reflection from sea","Dispersion in clouds"],0,"Shorter wavelengths scatter more."],
["Scattering of light by colloidal particles is the:",["Tyndall effect","Rayleigh effect","Doppler effect","Photoelectric effect"],0,"It makes a light beam visible in dusty air."],
["Danger signals are red because red is:",["Scattered the least","Scattered the most","Absorbed fully","A cool colour"],0,"It can be seen from far away."],
["Which colour deviates most in a prism?",["Red","Green","Violet","Yellow"],2,"Violet has the shortest wavelength."],
["Which colour deviates least in a prism?",["Red","Green","Violet","Blue"],0,"Red has the longest wavelength."],
["Twinkling of stars is due to:",["Atmospheric refraction","Reflection","Dispersion","Absorption"],0,"The changing refractive index of air flickers starlight."],
["The Sun looks red at sunrise because:",["Blue light is scattered away","Red is scattered most","The Sun is hotter","Clouds are red"],0,"Light travels a longer path through air."],
["Cells that respond to dim light are:",["Rods","Cones","Neurons","Iris cells"],0,"Cones detect colour in bright light."],
["Splitting of white light into its colours is:",["Dispersion","Reflection","Scattering","Interference"],0,"Newton did it with a glass prism."],
["A cloudy eye lens causing blurred vision is:",["Cataract","Myopia","Hypermetropia","Presbyopia"],0,"It is treated by surgery."],
["The eye lens is made of:",["Transparent flexible tissue","Hard glass","Plastic","Muscle"],0,"Its curvature can be changed."],
["The transparent front part of the eye is the:",["Cornea","Retina","Iris","Sclera"],0,"Light enters through it."],
["The coloured part of the eye is the:",["Iris","Cornea","Pupil","Retina"],0,"It controls the size of the pupil."],
["The optic nerve carries signals to the:",["Brain","Heart","Iris","Lens"],0,"The brain interprets the image."],
["The image formed on the retina is:",["Real and inverted","Virtual and erect","Real and erect","Virtual and inverted"],0,"The brain re-inverts it."],
["In myopia the image forms:",["In front of the retina","Behind the retina","On the retina","On the lens"],0,"The eyeball is too long or the lens too curved."],
["In hypermetropia the image forms:",["Behind the retina","In front of the retina","On the retina","On the cornea"],0,"The eyeball is too short or the focal length too long."],
["Myopia is also called:",["Near-sightedness","Far-sightedness","Old-age sight","Colour blindness"],0,"Distant objects look blurred."],
["Hypermetropia is also called:",["Far-sightedness","Near-sightedness","Cataract","Astigmatism"],0,"Nearby objects look blurred."],
["A person with myopia cannot see clearly:",["Distant objects","Nearby objects","Colours","Moving objects"],0,"The far point is nearer than infinity."],
["The near point of a hypermetropic eye is:",["Farther than 25 cm","Closer than 25 cm","Exactly 25 cm","At infinity"],0,"A convex lens corrects it."],
["The focal length of the eye lens is adjusted by the:",["Ciliary muscles","Iris","Cornea","Optic nerve"],0,"They change the lens curvature."],
["A bifocal lens has:",["Concave upper part and convex lower part","Two convex parts","Two concave parts","Plane glass"],0,"It corrects both distant and near vision."],
["Which visible colour has the longest wavelength?",["Red","Violet","Green","Blue"],0,"Violet has the shortest."],
["The number of colours in the spectrum of white light is:",["Seven","Five","Three","Nine"],0,"VIBGYOR."],
["Colours split in a prism because they travel at different ____ in glass.",["Speeds","Brightness","Charges","Masses"],0,"So they bend by different amounts."],
["The sky appears dark to astronauts because:",["There is no atmosphere to scatter light","Scattering is very high","Light is reflected","Light disperses"],0,"No scattering occurs in space."],
["Advance sunrise and delayed sunset are due to:",["Atmospheric refraction","Dispersion","Scattering","Reflection"],0,"The Sun is visible about 2 minutes early and late."],
["Planets do not twinkle because they are:",["Closer, so act as extended sources","Brighter","Larger","Fixed in position"],0,"Variations average out over the larger source."],
["In corneal blindness, ____ is transplanted.",["Cornea","Retina","Lens","Iris"],0,"This is done through eye donation."]]],
["Electricity",[
["The SI unit of electric current is:",["Ampere","Volt","Ohm","Watt"],0,"Current is the rate of flow of charge."],
["The SI unit of potential difference is:",["Ampere","Volt","Ohm","Joule"],1,"1 volt = 1 joule per coulomb."],
["Ohm’s law is:",["V = IR","V = I/R","V = I + R","I = VR"],0,"At constant temperature, V is proportional to I."],
["Resistance of a conductor is directly proportional to its:",["Length","Area of cross-section","Current","Voltage"],0,"R = ρl/A."],
["The SI unit of resistivity is:",["Ohm metre","Ohm","Siemens","Ohm per metre"],0,"From ρ = RA/l."],
["In a series circuit the same ____ flows through every resistor.",["Current","Voltage","Resistance","Power"],0,"Voltage divides in series."],
["Household circuits are connected in:",["Parallel","Series","Series only for bulbs","Neither"],0,"Each appliance gets the same voltage."],
["Two 4 Ω resistors in parallel give:",["8 Ω","4 Ω","2 Ω","1 Ω"],2,"1/R = 1/4 + 1/4 = 1/2."],

["1 kilowatt-hour equals:",["3.6×10⁶ J","3.6×10³ J","1000 J","3600 J"],0,"1000 W × 3600 s."],
["A fuse wire is made of an alloy with:",["Low melting point","High melting point","Very high resistance","Magnetic properties"],0,"It melts and breaks the circuit on overload."],
["An ammeter is connected in:",["Series","Parallel","Both","Neither"],0,"It has very low resistance."],
["A voltmeter is connected in:",["Series","Parallel","Both","Neither"],1,"It has very high resistance."],
["The filament of an electric bulb is made of:",["Tungsten","Copper","Nichrome","Iron"],0,"Tungsten has a very high melting point."],
["Alloys have ____ resistivity than pure metals.",["Higher","Lower","Equal","Zero"],0,"That is why nichrome is used in heaters."],
["The charge of an electron is:",["1.6×10⁻¹⁹ C","1.6×10¹⁹ C","9.1×10⁻³¹ C","3×10⁸ C"],0,"It is negative."],
["A current of 2 A flows for 5 s. The charge is:",["10 C","2.5 C","7 C","0.4 C"],0,"Q = It."],
["The current drawn by a 100 W, 220 V bulb is about:",["0.45 A","2.2 A","0.22 A","4.5 A"],0,"I = P/V."],
["5 Ω and 10 Ω in series give:",["15 Ω","5 Ω","3.3 Ω","50 Ω"],0,"Series resistances add."],
["Which appliance works on the heating effect of current?",["Electric iron","Electric fan","Loudspeaker","Transformer"],0,"It uses a high-resistance heating element."],
["One volt is the potential difference when ____ of work moves 1 coulomb.",["1 joule","1 watt","1 newton","1 ampere"],0,"V = W/Q."],
["Electric current is the flow of:",["Charge","Mass","Heat","Sound"],0,"Measured in amperes."],
["Conventional current flows from:",["Positive to negative terminal","Negative to positive terminal","Both ways","Neither"],0,"Electrons actually move the opposite way."],
["The V–I graph of an ohmic conductor is:",["A straight line","A curve","A circle","Parallel to the axis"],0,"V is proportional to I."],

["If a wire’s radius is halved, its resistance becomes:",["4 times","2 times","Half","One quarter"],0,"Area becomes one quarter."],
["Which has the lowest resistivity?",["Silver","Nichrome","Glass","Rubber"],0,"Silver is the best conductor."],

["Three 3 Ω resistors in series give:",["9 Ω","1 Ω","3 Ω","6 Ω"],0,"Series resistances add."],
["Three 3 Ω resistors in parallel give:",["1 Ω","9 Ω","3 Ω","0.33 Ω"],0,"1/R = 1/3 + 1/3 + 1/3 = 1."],
["In a parallel circuit, the ____ across each resistor is the same.",["Potential difference","Current","Power","Heat"],0,"Current divides."],
["Electric power equals:",["VI","V/I","I/V","V + I"],0,"P = VI = I²R."],
["A 60 W bulb used for 5 hours consumes:",["0.3 kWh","3 kWh","12 kWh","0.12 kWh"],0,"0.06 kW × 5 h."],
["The commercial unit of electrical energy is the:",["Kilowatt-hour","Joule","Watt","Volt"],0,"1 unit = 1 kWh."],
["The current through a 10 Ω resistor at 5 V is:",["0.5 A","2 A","50 A","5 A"],0,"I = V/R."],

["House bulbs are connected in parallel so that:",["If one fails the others keep working","Less current is needed","Voltage divides","Wires are cheaper"],0,"Each gets the full supply voltage."],
["Resistance of a wire does NOT depend on its:",["Applied voltage","Length","Area of cross-section","Material"],0,"Resistance is a property of the wire."],
["The SI unit of electric charge is the:",["Coulomb","Ampere","Volt","Ohm"],0,"1 C = 1 A·s."],
["1 coulomb equals the charge of about ____ electrons.",["6.25×10¹⁸","1.6×10¹⁹","9.1×10³¹","3×10⁸"],0,"1/(1.6×10⁻¹⁹)."]]],
["Magnetic Effects of Electric Current",[
["Oersted showed that a current-carrying wire produces a:",["Magnetic field","Electric field","Gravitational field","Sound wave"],0,"A compass needle deflects near a current."],
["Outside a bar magnet, field lines go from:",["North to south pole","South to north pole","Centre to ends","They do not form loops"],0,"Inside the magnet they go south to north."],
["Two magnetic field lines can never:",["Intersect","Be curved","Form closed loops","Be close together"],0,"There is one direction of field at each point."],
["The right-hand thumb rule gives the direction of:",["Magnetic field around a current","Force on a conductor","Induced voltage","Resistance"],0,"Thumb along current, curled fingers show field."],
["In Fleming’s left-hand rule, the thumb shows:",["Force (motion)","Current","Magnetic field","Voltage"],0,"Forefinger is field, middle finger is current."],
["An electric motor converts:",["Electrical to mechanical energy","Mechanical to electrical","Heat to light","Chemical to heat"],0,"It uses force on a current-carrying coil."],
["An electric generator converts:",["Mechanical to electrical energy","Electrical to mechanical","Light to heat","Sound to light"],0,"It works on electromagnetic induction."],
["The split-ring commutator in a motor:",["Reverses current direction","Raises voltage","Stores charge","Reduces friction"],0,"This keeps the coil rotating the same way."],
["Electromagnetic induction was discovered by:",["Faraday","Oersted","Ampere","Newton"],0,"A changing field induces a current."],
["The frequency of AC in India is:",["50 Hz","60 Hz","100 Hz","25 Hz"],0,"It reverses direction every 1/100 s."],
["The domestic supply voltage in India is about:",["110 V","220 V","440 V","12 V"],1,"It is supplied as AC."],
["The live wire usually has ____ insulation.",["Red","Green","Black","Blue"],0,"Neutral is black and earth is green."],
["The earth wire usually has ____ insulation.",["Red","Green","Black","Blue"],1,"It connects the metal body to the ground."],
["The earth wire protects us from:",["Electric shock","High voltage","Low frequency","Heating"],0,"Leakage current flows to the ground."],
["A short circuit happens when:",["Live and neutral wires touch","The earth wire is removed","A bulb fuses","Current is zero"],0,"Resistance drops and current rises suddenly."],
["The field of a current-carrying solenoid is similar to that of a:",["Bar magnet","Horseshoe magnet only","Straight wire","Earth only"],0,"One end acts as north, the other as south."],
["The field of a solenoid is increased by:",["More turns","Less current","Removing the core","Thinner turns only"],0,"More turns and more current give a stronger field."],
["The core of an electromagnet is made of:",["Soft iron","Steel","Copper","Aluminium"],0,"Soft iron magnetises and demagnetises easily."],
["Force on a conductor is maximum when it is ____ to the field.",["Perpendicular","Parallel","At 45°","At 0°"],0,"F = BIL sin θ."],
["Alternating current:",["Reverses direction periodically","Never changes direction","Flows only once","Is stored in cells"],0,"DC from a cell flows in one direction."],
["Magnetic field strength is greater where the field lines are:",["Closer together","Farther apart","Parallel only","Absent"],0,"Crowded lines mean a stronger field."],
["The SI unit of magnetic field strength is the:",["Tesla","Ampere","Volt","Ohm"],0,"Named after Nikola Tesla."],
["A compass needle is a:",["Small bar magnet","Iron rod","Electromagnet","Copper wire"],0,"It aligns with the Earth’s field."],
["The magnetic field inside a long solenoid is:",["Uniform","Zero","Random","Weakest at the centre"],0,"Parallel straight field lines."],
["Field lines around a straight current-carrying wire are:",["Concentric circles","Straight lines","Parallel lines","Outward spirals"],0,"Their direction follows the right-hand thumb rule."],
["Near a straight wire, the field ____ as the distance increases.",["Decreases","Increases","Stays the same","Becomes infinite"],0,"The circles get farther apart."],
["Reversing the current in a wire reverses its:",["Magnetic field direction","Resistance","Length","Material"],0,"The field lines flip direction."],
["The direction of induced current is given by:",["Fleming’s right-hand rule","Fleming’s left-hand rule","Ohm’s law","Snell’s law"],0,"Used for generators."],
["A galvanometer is used to detect:",["The presence of current in a circuit","Resistance","Power","Frequency"],0,"Its pointer deflects with current."],
["In an AC generator the output reverses direction every:",["Half rotation","Full rotation","Two rotations","Never"],0,"One cycle takes a full rotation."],
["Direct current is produced by a:",["Cell or battery","AC generator","Transformer","Alternator"],0,"It flows in one direction."],
["A DC generator uses a:",["Split-ring commutator","Slip rings","Fuse","Transformer"],0,"It keeps the output in one direction."],
["Slip rings are used in an:",["AC generator","DC motor","DC generator","Electromagnet"],0,"They allow continuous contact while the coil rotates."],
["An advantage of AC over DC is that it:",["Can be sent over long distances with less loss","Can be stored easily","Is safer","Has no frequency"],0,"Voltage can be changed easily."],
["A fuse is connected in the:",["Live wire","Neutral wire","Earth wire only","Bulb"],0,"It breaks the live circuit on overload."],
["Overloading happens when:",["Too many appliances draw current from one socket","The fuse is new","The wire is thick","The voltage is zero"],0,"Too much current heats the wires."],
["Electromagnets are used in:",["Electric bells and cranes","Compasses","Rulers","Mirrors"],0,"They can be switched on and off."],
["Permanent magnets are made from:",["Steel","Soft iron","Copper","Aluminium"],0,"Steel retains magnetism."],
["The earth wire is connected to the:",["Metallic body of the appliance","Live wire","Neutral wire","Fuse"],0,"It carries leakage current to the ground."],
["A force on a current-carrying conductor in a magnetic field is the principle of the:",["Electric motor","Generator","Transformer","Fuse"],0,"Fleming’s left-hand rule applies."]]]]},

const vid=()=>{let i=ls("vp_id");if(!i){i=(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()).slice(0,36);ls("vp_id",i)}return i};
let fp=Promise.resolve(),lastWhy="";
async function send(p){let why="";try{const r=await jsonp(SHEET_URL+"?add="+encodeURIComponent(JSON.stringify(p)));if(r&&r.ok)return"";why=r&&r.error==="key"?"old Code.gs":(r&&r.error)||"script rejected"}catch(e){why="no answer"}
 try{await to(fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(p)}),20000);return""}catch(e){return why+", "+((e&&e.message)||"network blocked")}}
async function doFlush(){const q=ls("vp_q")||[];if(!q.length)return true;if(!ON){lastWhy="link not set";return false}const left=[];for(const p of q){const w=await send(p);if(w){left.push(p);lastWhy=w}}ls("vp_q",left);return !left.length}
function flush(){fp=fp.then(doFlush);return fp}
function setSt(ok){quiz.status=ok?"✅ Result sent to your teacher.":`⚠️ Could not send (${lastWhy}). Saved on this phone. <button class="back" onclick="retry()">🔄 Retry</button>`;const e=$("#sv");if(e)e.innerHTML=quiz.status}
async function retry(){const e=$("#sv");if(e)e.textContent="Sending…";setSt(await flush())}
async function init(){me=ls("vp_me");hist=ls("vp_hist")||[];render();flush();window.addEventListener("online",flush)}
function head(){hr.innerHTML=(me?`<button class="btn sm" onclick="logout()">${esc(me.name)} ⎋</button> `:"")+`<button class="btn sm" onclick="tlogin()">👩‍🏫 Teacher</button>`}
function logout(){me=null;ls("vp_me",null);render()}
function login(){app.innerHTML=`<div class="card"><h2>👋 Welcome!</h2><label>Your name</label><input id="nm" placeholder="e.g. Rahul Sharma"><label>Class</label><select id="cl"><option>8th</option><option>10th</option></select><button class="btn" onclick="doLogin()">Start</button><p class="note">Your name and scores are visible to your teacher.</p></div>`}
async function doLogin(){const n=$("#nm").value.trim();if(!n)return;me={name:n,cls:$("#cl").value};ls("vp_me",me);ls("vp_me",me);render()}
async function save(){ls("vp_hist",hist);const a=hist[hist.length-1];if(!a||!me)return false;const q=ls("vp_q")||[];q.push({id:vid(),name:me.name,cls:me.cls,title:a.title,s:a.s,t:a.t,tm:a.tm,d:a.d});ls("vp_q",q);return flush()}
function render(){head();if(!me)return login();home()}
function myRes(){if(!hist.length)return"";return`<div class="card wrap"><b>📊 My Results (all chapters)</b><table><tr><th>Chapter</th><th>Score</th><th>%</th><th>Date</th></tr>${hist.slice().reverse().slice(0,40).map(a=>`<tr><td>${esc(a.title)}</td><td>${a.s}/${a.t}</td><td>${Math.round(a.s*100/a.t)}%</td><td>${a.d}</td></tr>`).join("")}</table></div>`}
function home(){quiz=null;goTop();
 let h=`<h2>Hello, ${esc(me.name)}  👋</h2>`;
 h+=stats();Q.forEach(s=>{s.ch.forEach((c,i)=>{const n=hist.filter(a=>a.q.startsWith(s.id+i));const best=n.length?Math.max(...n.map(a=>Math.round(a.s*100/a.t))):null;h+=`<button class="card tile" onclick="pickSet('${s.id}',${i})"><span class="badge">${s.cls} · ${s.sub}</span><br><b>${s.ico} ${c[0]}</b><small>${c[1].length} questions${c[1].length>20?" · "+Math.ceil(c[1].length/20)+" sets":""}${best!==null?` · Best ${best}%`:""}</small></button>`})});
 h+=myRes();h+=`<div class="card"><b>🚧 Coming soon</b><small class="note"><br>More chapters, notes and Maths</small></div>`;
 h+=`<p style="text-align:center"><button class="back" onclick="tlogin()">👩‍🏫 Teacher login</button></p>`;
 app.innerHTML=h}
function pickSet(id,i){const s=Q.find(x=>x.id===id),n=Math.ceil(s.ch[i][1].length/20);if(n<2)return start(id,i,0);
 let h=`<button class="back" onclick="home()">← Back</button><h2>${esc(s.ch[i][0])}</h2>`;
 for(let k=0;k<n;k++){const key=id+i+(k?"s"+k:""),a=hist.filter(x=>x.q===key),b=a.length?Math.max(...a.map(x=>Math.round(x.s*100/x.t))):null,len=Math.min(20,s.ch[i][1].length-k*20);h+=`<button class="card tile" onclick="start('${id}',${i},${k})"><b>Set ${k+1}</b><small>${len} questions${b!==null?" · Best "+b+"%":""}</small></button>`}
 app.innerHTML=h;goTop()}
function start(id,i,k){k=k||0;const s=Q.find(x=>x.id===id);quiz={s,i,k,qs:sh(s.ch[i][1].slice(k*20,k*20+20)).map(mix),t0:Date.now(),n:0,sc:0,ans:[],ok:[],pick:null};show();goTop()}
function show(){clearInterval(tm);const{qs,n,pick}=quiz,q=qs[n],mc=!!q[1],done=pick!==null;
 let h=`<button class="back" onclick="clearInterval(tm);home()">← Back</button><div class="hrow note"><span>Question ${n+1} / ${qs.length} · ${esc(quiz.s.ch[quiz.i][0])}</span><b id="tt" style="font-size:16px"></b></div><div class="bar"><i id="tb" style="width:100%;transition:width 1s linear"></i></div><div class="card"><span class="badge">${mc?"MCQ":q[0].includes("____")||q[0].includes("→")?"Fill in the blank":"One word"}</span><br><b>${q[0]}</b>`;
 if(mc)q[1].forEach((o,k)=>{let c="opt";if(done){if(k===q[2])c+=" ok";else if(k===pick)c+=" no"}h+=`<button class="${c}" ${done?"disabled":""} onclick="ans(${k})">${"ABCD"[k]}. ${o}</button>`});
 else h+=`<input id="tx" placeholder="Type your answer" ${done?"disabled":""} autocomplete="off" value="${done&&pick!==-1?esc(pick):""}"><button class="btn" ${done?"style='display:none'":""} onclick="ans($('#tx').value)">Submit</button>`;
 if(done){const ok=quiz.ok[n];h+=`<div class="sol"><b>${pick===-1?"⏰ Time up! ":ok?"✅ Correct!":"❌ Wrong. "}${ok?"":"Answer: "+(mc?q[1][q[2]]:q[2][0])}</b><br>${q[3]}</div><button class="btn" onclick="next()">${n+1<qs.length?"Next question →":"See result"}</button>`}
 app.innerHTML=h+"</div>";
 if(!done){left=T;const tot=left,t=$("#tt"),bar=$("#tb"),tick=()=>{t.textContent="⏱ "+left+"s";t.style.color=left<=8?"var(--no)":"var(--tx)";bar.style.width=left*100/tot+"%"};tick();tm=setInterval(()=>{left--;tick();if(left<=0){clearInterval(tm);ans(-1)}},1000)}}
function ans(k){clearInterval(tm);const q=quiz.qs[quiz.n];if(quiz.pick!==null)return;
 const ok=k!==-1&&(q[1]?k===q[2]:hit(k,q[2]));
 quiz.pick=(k===""?-1:k);quiz.ans.push(k);quiz.ok.push(ok);if(ok)quiz.sc++;show()}
function next(){quiz.n++;quiz.pick=null;if(quiz.n<quiz.qs.length){show();goTop();return}
 const c=quiz.s.ch[quiz.i],key=quiz.s.id+quiz.i+(quiz.k?"s"+quiz.k:""),nm=c[0]+(c[1].length>20?" · Set "+(quiz.k+1):"");
 quiz.prev=hist.filter(a=>a.q===key).slice(-1)[0];hist.push({q:key,title:nm,s:quiz.sc,t:quiz.qs.length,tm:quiz.tm=Math.round((Date.now()-quiz.t0)/1000),d:new Date().toISOString().slice(0,10)});quiz.status="Saving result…";res();
 save().then(setSt)}
function rv(j){const q=quiz.qs[j],ok=quiz.ok[j],g=quiz.ans[j],mc=!!q[1];return`<div class="card"><b>${j+1}. ${q[0]}</b><br>${ok?"✅":"❌"} Your answer: ${g===-1?"(no answer, time up)":mc?q[1][g]:esc(g)}${ok?"":`<br>Correct: ${mc?q[1][q[2]]:q[2][0]}`}<div class="sol">${q[3]}</div></div>`}
function bdg(){const pc=a=>Math.round(a.s*100/a.t),avg=hist.length?Math.round(hist.reduce((m,a)=>m+pc(a),0)/hist.length):0,ds=[...new Set(hist.map(a=>a.d))],best=hist.length?Math.max(...hist.map(pc)):0;let st=0,dt=new Date();if(!ds.includes(dt.toISOString().slice(0,10)))dt.setDate(dt.getDate()-1);while(ds.includes(dt.toISOString().slice(0,10))){st++;dt.setDate(dt.getDate()-1)}
 const b=[];if(hist.length>=1)b.push("🌱 First test");if(hist.length>=5)b.push("📚 5 tests");if(hist.length>=15)b.push("🎓 15 tests");if(st>=3)b.push("🔥 3-day streak");if(best>=80)b.push("🌟 80%+ score");if(best===100)b.push("🏆 Perfect score");return{avg,st,b}}
function stats(){if(!hist.length)return"";const x=bdg();return`<div class="card"><b>📈 Your progress</b><div class="g3"><div><b>${hist.length}</b>Tests</div><div><b>${x.avg}%</b>Average</div><div><b>${x.st}🔥</b>Day streak</div></div><div>${x.b.map(y=>`<span class="badge">${y}</span> `).join("")}</div></div>`}
function confetti(){for(let i=0;i<45;i++){const e=document.createElement("span");e.className="cf";e.style.left=Math.random()*100+"%";e.style.background="hsl("+Math.floor(Math.random()*360)+",80%,55%)";e.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
function res(tab){tab=tab||"s";const t=quiz.qs.length,c=quiz.sc,p=Math.round(c*100/t),tu=quiz.ans.filter(a=>a===-1).length,w=t-c-tu,tm=quiz.tm||0,ty=[[0,0],[0,0]];
 quiz.qs.forEach((q,j)=>{const k=q[1]?0:1;ty[k][1]++;if(quiz.ok[j])ty[k][0]++});
 const gr=p>=90?"Outstanding 🏆":p>=75?"Very good 🌟":p>=60?"Good 👍":p>=40?"Average, revise once more 📘":"Needs more practice 💪",col=p>=75?"var(--ok)":p>=40?"#e0902b":"var(--no)";
 const tabs=[["s","📊 Summary"],["q","🧩 Questions"],["r","📝 Revise ("+(w+tu)+")"],["a","📖 All answers"]];
 let h=`<button class="back" onclick="home()">← Back to Home</button><div class="tabs">${tabs.map(x=>`<button class="${x[0]===tab?"on":""}" onclick="res('${x[0]}')">${x[1]}</button>`).join("")}</div>`;
 if(tab==="s"){const pv=quiz.prev,df=pv?p-Math.round(pv.s*100/pv.t):null,x=bdg();
  h+=`<div class="card"><svg class="ring" viewBox="0 0 120 120" width="150" height="150"><circle cx="60" cy="60" r="52" stroke="var(--bd)"/><circle class="pg" cx="60" cy="60" r="52" stroke="${col}" stroke-dasharray="${(p*3.267).toFixed(1)} 327" transform="rotate(-90 60 60)"/><text x="60" y="58" text-anchor="middle" font-size="26" font-weight="800" fill="currentColor">${p}%</text><text x="60" y="76" text-anchor="middle" font-size="12" fill="currentColor">${c}/${t}</text></svg><p style="text-align:center;font-size:18px"><b>${gr}</b></p><div class="g3"><div><b>${c}</b>✅ Correct</div><div><b>${w}</b>❌ Wrong</div><div><b>${tu}</b>⏰ Time up</div></div><p class="note" style="text-align:center">⏱ ${Math.floor(tm/60)}m ${tm%60}s total · about ${Math.round(tm/t)}s per question${pv?`<br>Previous attempt: ${pv.s}/${pv.t} → ${df>0?"📈 +"+df+"%":df<0?"📉 "+df+"%":"same score"}`:""}</p><p class="note" id="sv" style="text-align:center">${quiz.status||""}</p>${x.b.length?`<div style="text-align:center">${x.b.map(y=>`<span class="badge">${y}</span> `).join("")}</div>`:""}</div><button class="btn" onclick="res('r')">📝 Revise my mistakes</button><br><br><button class="btn" onclick="start('${quiz.s.id}',${quiz.i},${quiz.k})">🔁 Try again (shuffled)</button><br><br><button class="btn" onclick="home()">🏠 Home and My Results</button>`;
  if(p>=80&&!quiz.cf){quiz.cf=1;confetti()}}
 else if(tab==="q")h+=`<div class="card"><b>Question-wise report</b><div class="qg">${quiz.ok.map((o,j)=>`<span class="qb ${o?"g":quiz.ans[j]===-1?"o":"r"}">${j+1}</span>`).join("")}</div><p class="note">Green = correct, red = wrong, orange = time up</p>${ty[0][1]?`<p>MCQ: <b>${ty[0][0]}/${ty[0][1]}</b></p>`:""}${ty[1][1]?`<p>One-word and fill in the blanks: <b>${ty[1][0]}/${ty[1][1]}</b></p>`:""}</div>`;
 else if(tab==="r")h+=(w+tu?quiz.ok.map((o,j)=>o?"":rv(j)).join(""):`<div class="card"><b>🎉 Perfect score! Nothing to revise.</b></div>`);
 else h+=quiz.qs.map((_,j)=>rv(j)).join("");
 app.innerHTML=h;goTop()}
function review(){res("a")}
function jsonp(u){return new Promise((res,rej)=>{const cb="vp"+Date.now(),sc=document.createElement("script"),t=setTimeout(()=>{rej(new Error(""));sc.remove()},15000);window[cb]=d=>{clearTimeout(t);res(d);sc.remove();delete window[cb]};sc.onerror=()=>{clearTimeout(t);rej(new Error(""));sc.remove()};sc.src=u+"&callback="+cb;document.head.appendChild(sc)})}
async function getRows(){const u=SHEET_URL+"?key="+encodeURIComponent(sessionStorage.getItem("vp_k")||"");let t;try{t=await to(fetch(u).then(x=>x.text()),15000)}catch(e){return await jsonp(u)}try{return JSON.parse(t)}catch(e){throw new Error("The script replied with an error: "+t.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,200))}}
function tlogin(){if(sessionStorage.getItem("vp_k"))return dash();app.innerHTML=`<button class="back" onclick="home()">← Back</button><div class="card"><h2>👩‍🏫 Teacher login</h2><input id="tk" type="password" placeholder="Teacher key"><p class="note">Use the secret word from the first line of Code.gs.</p><button class="btn" onclick="sessionStorage.setItem('vp_k',$('#tk').value);dash()">Open dashboard</button></div>`}
async function dash(f){f=f||"All";
 app.innerHTML=`<div class="hrow"><button class="back" onclick="home()">← Back</button><button class="back" onclick="dash('${f}')">🔄 Refresh</button></div><h2>Teacher Dashboard</h2><div id="t">Loading…</div>`;
 try{const r=await getRows();if(r.error==="key"){sessionStorage.removeItem("vp_k");throw new Error("Wrong teacher key. Use the secret word written in the first line of Code.gs.")}if(!r.rows)throw new Error("The Sheet script sent an unexpected reply.");const mp={};r.rows.forEach(v=>{const x=mp[v[1]]||(mp[v[1]]={name:v[2],cls:String(v[3]),attempts:[]});x.attempts.push({title:v[4],s:+v[5],t:+v[6],tm:+v[8],d:String(v[9]).slice(0,10)})});const st=Object.values(mp).filter(x=>f==="All"||x.cls===f);
 const at=[];st.forEach(x=>(x.attempts||[]).forEach(a=>at.push({n:x.name,...a})));
 const pc=a=>Math.round(a.s*100/a.t),avg=at.length?Math.round(at.reduce((m,a)=>m+pc(a),0)/at.length):0;
 const rows=st.map(x=>{const a=x.attempts||[],av=a.length?Math.round(a.reduce((m,y)=>m+pc(y),0)/a.length):0;return[x.name,x.cls,a.length,av+"%",a.length?Math.max(...a.map(pc))+"%":"-",a.length?a[a.length-1].d:"-",av]}).sort((p,q)=>q[6]-p[6]);
 at.sort((p,q)=>(q.d||"").localeCompare(p.d||""));
 const tb=(h,r)=>`<div class="card wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>"<tr>"+x.map(c=>`<td>${esc(c)}</td>`).join("")+"</tr>").join("")}</table></div>`;
 $("#t").innerHTML=`<div class="tabs">${["All","8th","10th"].map(c=>`<button class="${c===f?"on":""}" onclick="dash('${c}')">${c}</button>`).join("")}</div><div class="g3"><div><b>${st.length}</b>Students</div><div><b>${at.length}</b>Tests taken</div><div><b>${avg}%</b>Class average</div></div>`+(st.length?`<h2>🏅 Students (by average)</h2>`+tb(["Name","Class","Tests","Avg","Best","Last"],rows.map(r=>r.slice(0,6)))+`<h2>🕒 Recent tests</h2>`+tb(["Name","Test","Score","%","Time","Date"],at.slice(0,50).map(a=>[a.n,a.title,a.s+"/"+a.t,pc(a)+"%",a.tm?Math.floor(a.tm/60)+"m "+a.tm%60+"s":"-",a.d])):"No results in the Sheet yet. Finish one test, wait a few seconds, then tap Refresh.")}
 catch(e){$("#t").textContent=(e&&e.message)||"Could not reach the Sheet. In Apps Script set access to Anyone, then Deploy a New version."}}
init();
</script></body></html>
