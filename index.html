<style>

*{box-sizing:border-box}html,body{margin:0}body{font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:22px 18px 26px;border-radius:0 0 28px 28px}

.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.tile{cursor:pointer;display:block;width:100%;text-align:left;color:var(--tx);font:inherit}.tile:active{transform:scale(.98)}
.tile b{font-size:17px}.tile small{display:block;color:var(--mu)}
.badge{display:inline-block;background:var(--okb);color:var(--ok);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
h2{margin:6px 0 10px;font-size:20px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:6px 0 12px}
button.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;width:100%}
button.sm{width:auto;padding:7px 12px;font-size:13px;background:rgba(255,255,255,.22)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}

.sol{background:var(--okb);border-left:5px solid var(--ok);border-radius:12px;padding:12px;margin:10px 0;font-size:14.5px}

.big{font-size:44px;font-weight:800;color:var(--pr);text-align:center}

header{padding:20px 18px 24px;box-shadow:0 8px 24px rgba(11,110,135,.25)}
.hello{font-size:22px;font-weight:800;margin:4px 2px 12px}

.filters button.on{background:var(--pr);border-color:var(--pr);color:#fff}

.act{position:sticky;bottom:10px;margin-top:12px;z-index:5}.act .btn{box-shadow:0 6px 18px rgba(0,0,0,.18)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.hint{font-size:12.5px;color:var(--mu);text-align:center;margin:8px 0 0}
.exl{font-size:12px;color:var(--mu);margin-top:14px;font-weight:700}.chip.ex{border-style:dashed;padding:9px 14px}
.qb.s{background:#8a9a94}.btn.skip{background:transparent;color:var(--tx);border:1.5px solid var(--bd);box-shadow:none;margin-top:8px}
.bday{background:linear-gradient(135deg,#ff7eb3,#ff758c 55%,#ffb347);color:#fff;border-radius:22px;padding:18px 16px;text-align:center;margin-bottom:14px;box-shadow:0 10px 26px rgba(255,117,140,.35)}
.bday h2{margin:6px 0 8px;font-size:23px}.bday p{margin:6px 0;font-size:15px;line-height:1.5}.bday .by{font-weight:700;font-size:14px}
.bday .bl{font-size:30px;animation:bnc 1.4s ease-in-out infinite}@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

["13. Statistics",[

["The median of grouped data can be found graphically using",["Ogives","Histograms only","Bar graphs","Pie charts"],0,"Cumulative frequency curves."],

function skip(){if(quiz.pick!==null)return;clearInterval(tm);quiz.ans.push(-2);quiz.ok.push(false);next()}

function bdg(){const pc=a=>Math.round(a.s*100/a.t),avg=hist.length?Math.round(hist.reduce((m,a)=>m+pc(a),0)/hist.length):0,ds=[...new Set(hist.map(a=>a.d))],best=hist.length?Math.max(...hist.map(pc)):0;let st=0,dt=new Date();if(!ds.includes(dt.toISOString().slice(0,10)))dt.setDate(dt.getDate()-1);while(ds.includes(dt.toISOString().slice(0,10))){st++;dt.setDate(dt.getDate()-1)}

function res(tab){tab=tab||"s";const t=quiz.qs.length,c=quiz.sc,p=Math.round(c*100/t),tu=quiz.ans.filter(a=>a===-1).length,sk=quiz.ans.filter(a=>a===-2).length,w=t-c-tu-sk,tm=quiz.tm||0,ty=[[0,0],[0,0]];

  if(p>=80&&!quiz.cf){quiz.cf=1;confetti()}}
